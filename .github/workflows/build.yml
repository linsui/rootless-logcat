name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - run: |
          mv $ANDROID_HOME/platforms/android-37.0 android-37.0
          ./gradlew assembleRegularRelease || true
          cp $ANDROID_HOME/platforms/android-37.0/package.xml sdk-package.xml
          cp android-37.0/package.xml gha-package.xml

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package.xml
          path: *-package.xml
